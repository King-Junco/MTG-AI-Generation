<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Card Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e3a8a 100%);
            min-height: 100vh;
        }
        .card-enter {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #a855f7;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-white p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-5xl font-bold mb-4 bg-gradient-to-r from-yellow-400 to-orange-500 bg-clip-text text-transparent">
                Magic: The Gathering
            </h1>
            <h2 class="text-3xl font-semibold mb-2">AI Card Generator</h2>
            <p class="text-gray-300">Powered by GPT-2 Fine-tuned Model</p>
        </div>

        <!-- Input Section -->
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 mb-8 shadow-2xl border border-white/20">
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2">Card Prompt</label>
                    <input
                        type="text"
                        id="promptInput"
                        placeholder="e.g., red dragon, blue wizard, green forest..."
                        class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-white placeholder-gray-400"
                    />
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">
                        Number of Cards: <span id="numCardsValue">5</span>
                    </label>
                    <input
                        type="range"
                        id="numCardsSlider"
                        min="1"
                        max="10"
                        value="5"
                        class="w-full h-2 bg-white/20 rounded-lg appearance-none cursor-pointer"
                    />
                    <div class="flex justify-between text-xs text-gray-400 mt-1">
                        <span>1</span>
                        <span>10</span>
                    </div>
                </div>

                <button
                    id="generateBtn"
                    class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 disabled:from-gray-600 disabled:to-gray-700 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 flex items-center justify-center gap-2 shadow-lg"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                    </svg>
                    <span id="btnText">Generate Cards</span>
                </button>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorContainer" class="hidden bg-red-500/20 border border-red-500/50 rounded-lg p-4 mb-8 flex items-start gap-3">
            <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <div>
                <p class="font-semibold">Error</p>
                <p class="text-sm text-gray-200" id="errorMessage"></p>
            </div>
        </div>

        <!-- Cards Display -->
        <div id="cardsContainer" class="hidden space-y-4">
            <h3 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <svg class="w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                </svg>
                Generated Cards (<span id="cardCount">0</span>)
            </h3>
            <div id="cardsList" class="grid gap-4"></div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-16 text-gray-400">
            <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
            </svg>
            <p class="text-lg">Enter a prompt and click Generate to create MTG cards</p>
        </div>
    </div>

    <script>
        const promptInput = document.getElementById('promptInput');
        const numCardsSlider = document.getElementById('numCardsSlider');
        const numCardsValue = document.getElementById('numCardsValue');
        const generateBtn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const errorContainer = document.getElementById('errorContainer');
        const errorMessage = document.getElementById('errorMessage');
        const cardsContainer = document.getElementById('cardsContainer');
        const cardsList = document.getElementById('cardsList');
        const cardCount = document.getElementById('cardCount');
        const emptyState = document.getElementById('emptyState');

        // Update slider value display
        numCardsSlider.addEventListener('input', (e) => {
            numCardsValue.textContent = e.target.value;
        });

        // Handle Enter key
        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                generateCards();
            }
        });

        // Generate cards function
        async function generateCards() {
            const prompt = promptInput.value.trim();
            const numCards = parseInt(numCardsSlider.value);

            // Validation
            if (!prompt) {
                showError('Please enter a prompt');
                return;
            }

            // Reset UI
            hideError();
            cardsContainer.classList.add('hidden');
            emptyState.classList.add('hidden');
            cardsList.innerHTML = '';

            // Show loading state
            generateBtn.disabled = true;
            btnText.innerHTML = '<div class="spinner"></div> Generating Cards...';

            try {
                const response = await fetch('http://localhost:5000/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        num_cards: numCards,
                    }),
                });

                const data = await response.json();

                if (data.success) {
                    displayCards(data.cards);
                } else {
                    showError(data.error || 'Failed to generate cards');
                }
            } catch (err) {
                showError('Failed to connect to backend. Make sure the Flask server is running on port 5000.');
                console.error('Error:', err);
            } finally {
                // Reset button
                generateBtn.disabled = false;
                btnText.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                    </svg>
                    Generate Cards
                `;
            }
        }

        function displayCards(cards) {
            emptyState.classList.add('hidden');
            cardsContainer.classList.remove('hidden');
            cardCount.textContent = cards.length;

            cards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card-enter bg-gradient-to-br from-gray-800/50 to-gray-900/50 backdrop-blur-lg rounded-xl p-6 border border-white/10 shadow-xl hover:shadow-2xl transition-all duration-300 hover:scale-[1.01]';
                cardElement.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="bg-gradient-to-br from-purple-500 to-pink-500 rounded-lg w-12 h-12 flex items-center justify-center font-bold text-xl flex-shrink-0">
                            ${index + 1}
                        </div>
                        <div class="flex-1">
                            <pre class="text-sm text-gray-100 whitespace-pre-wrap font-mono leading-relaxed">${card}</pre>
                        </div>
                    </div>
                `;
                cardsList.appendChild(cardElement);
            });
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorContainer.classList.remove('hidden');
        }

        function hideError() {
            errorContainer.classList.add('hidden');
        }

        // Attach generate function to button
        generateBtn.addEventListener('click', generateCards);
    </script>
</body>
</html>
